name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: love-web
          path: apps/client/dist/
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose --profile https config --quiet
        env:
          MEDIA_SIGNING_SECRET: ci-docker-signing-key-for-smoke-tests-only
          LOVE_DOMAIN: love.example.com
      - run: docker build -t love-ci .
      - run: docker run -d --name love-smoke -p 127.0.0.1:3000:3000 -e MEDIA_SIGNING_SECRET=ci-docker-signing-key-for-smoke-tests-only -e ADMIN_USERNAME=ci_admin -e ADMIN_PASSWORD=ci-admin-password-for-smoke -v love-smoke-data:/app/data love-ci
      - run: node scripts/docker-smoke.mjs
      - run: docker restart love-smoke && node scripts/docker-smoke.mjs --verify-persistence
      - run: docker logs love-smoke
        if: failure()
      - run: docker rm -f love-smoke; docker volume rm love-smoke-data
        if: always()
  android:
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOVE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run android:prepare
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: apps/client/android
      - run: python scripts/verify-android-push.py
      - uses: actions/upload-artifact@v4
        with:
          name: love-android-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
