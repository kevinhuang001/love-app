name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/love-apt/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci-media-tools.sh') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-ubuntu24-
      - name: Ensure test media tools
        timeout-minutes: 10
        run: bash scripts/ci-media-tools.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: |
          # Playwright also uses apt; avoid the mirror that stalled the previous run.
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-love-ci-network >/dev/null
          npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: love-web
          path: apps/client/dist/
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: love
          POSTGRES_PASSWORD: ci-postgres-test-password
          POSTGRES_DB: love_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U love -d love_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/love-apt/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci-media-tools.sh') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-ubuntu24-
      - name: Ensure PostgreSQL test media tools
        timeout-minutes: 10
        run: bash scripts/ci-media-tools.sh
      - run: npm ci --no-audit --no-fund
      - run: npm test -w apps/server
        env:
          TEST_DATABASE_URL: postgres://love:ci-postgres-test-password@localhost:5432/love_test
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.cn]
    env:
      LOVE_DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: docker compose --profile https config --quiet
        env:
          MEDIA_SIGNING_SECRET: ci-docker-signing-key-for-smoke-tests-only
          LOVE_DOMAIN: love.example.com
      - run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v3
      - name: Build tested image with layer cache
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: love-ci
          cache-from: type=gha,scope=love-linux-amd64-${{ matrix.dockerfile }}
          cache-to: type=gha,scope=love-linux-amd64-${{ matrix.dockerfile }},mode=max,ignore-error=true,timeout=2m
      - name: Verify domestic mirror configuration
        if: matrix.dockerfile == 'Dockerfile.cn'
        run: |
          docker run --rm --entrypoint sh love-ci -c '
            set -eu
            test "$(npm config get registry)" = "https://registry.npmmirror.com/"
            test "$PIP_INDEX_URL" = "https://mirrors.ustc.edu.cn/pypi/simple"
            grep -q "https://mirrors.ustc.edu.cn/debian$" /etc/apt/sources.list.d/debian.sources
            grep -q "https://mirrors.ustc.edu.cn/debian-security$" /etc/apt/sources.list.d/debian.sources
            test -s /etc/ssl/certs/ca-certificates.crt
            ffmpeg -version >/dev/null
          '
      - run: node scripts/setup-compose.test.mjs
      - run: node scripts/manager-compose-smoke.mjs
      - name: Verify HTTPS challenge bootstrap and certificate reload
        if: matrix.dockerfile == 'Dockerfile'
        run: node scripts/certbot-proxy-smoke.mjs
      - run: docker run -d --name love-smoke -p 127.0.0.1:3000:3000 -e MEDIA_SIGNING_SECRET=ci-docker-signing-key-for-smoke-tests-only -e ADMIN_USERNAME=ci_admin -e ADMIN_PASSWORD=ci-admin-password-for-smoke -v love-smoke-data:/app/data love-ci
      - run: node scripts/docker-smoke.mjs
      - run: docker restart love-smoke && node scripts/docker-smoke.mjs --verify-persistence
      - name: Start PostgreSQL Compose stack and verify persistence
        run: |
          set -euo pipefail
          docker rm -f love-smoke
          docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml up -d --no-build --wait
          SMOKE_CONTAINER=$(docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml ps -q love) node scripts/docker-smoke.mjs
          docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml up -d --no-build --force-recreate --wait
          SMOKE_CONTAINER=$(docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml ps -q love) node scripts/docker-smoke.mjs --verify-persistence
        env:
          LOVE_IMAGE: love-ci
          LOVE_BIND_IP: '0.0.0.0'
          SMOKE_BIND_IP: '0.0.0.0'
          SMOKE_DATABASE: postgres
          MEDIA_SIGNING_SECRET: ci-docker-signing-key-for-smoke-tests-only
          ADMIN_USERNAME: ci_admin
          ADMIN_PASSWORD: ci-admin-password-for-smoke
          POSTGRES_PASSWORD: 'ci-postgres''pa"ss$word#\literal'
      - run: docker logs love-smoke || true
        if: failure()
      - run: |
          docker rm -f love-smoke || true
          docker volume rm love-smoke-data || true
        if: always()
      - run: docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml logs --tail 100
        if: failure()
        env:
          MEDIA_SIGNING_SECRET: ci-docker-signing-key-for-smoke-tests-only
          POSTGRES_PASSWORD: 'ci-postgres''pa"ss$word#\literal'
      - run: docker compose -p love-pg-ci -f compose.yml -f compose.postgres.yml down --volumes
        if: always()
        env:
          MEDIA_SIGNING_SECRET: ci-docker-signing-key-for-smoke-tests-only
          POSTGRES_PASSWORD: 'ci-postgres''pa"ss$word#\literal'
  android:
    # Build independently; release workflows still require every CI job to pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LOVE_VERSION_CODE: ${{ github.run_number }}
      LOVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.LOVE_ANDROID_KEYSTORE_BASE64 }}
      LOVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOVE_ANDROID_KEYSTORE_PASSWORD }}
      LOVE_ANDROID_KEY_ALIAS: ${{ secrets.LOVE_ANDROID_KEY_ALIAS }}
      LOVE_ANDROID_KEY_PASSWORD: ${{ secrets.LOVE_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci --no-audit --no-fund
      - run: npm run android:prepare
      - name: Prepare persistent APK signing key
        id: signing
        run: node scripts/android-key.mjs
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assemble${{ steps.signing.outputs.mode == 'release' && 'Release' || 'Debug' }} --no-daemon
        working-directory: apps/client/android
      - run: python scripts/verify-android-push.py
        env:
          LOVE_APK_PATH: ${{ steps.signing.outputs.apk }}
          LOVE_APK_SIGNING_METADATA: ${{ steps.signing.outputs.metadata }}
      - name: Verify release signing even without repository credentials
        if: steps.signing.outputs.mode == 'debug'
        run: |
          set -euo pipefail
          export RUNNER_TEMP="$RUNNER_TEMP/android-signing-fixture"
          mkdir -p "$RUNNER_TEMP"
          export LOVE_ANDROID_KEYSTORE_PASSWORD=ci-fixture-password
          export LOVE_ANDROID_KEY_PASSWORD=ci-fixture-password
          export LOVE_ANDROID_KEY_ALIAS=love
          keytool -genkeypair -keystore "$RUNNER_TEMP/source.jks" \
            -storepass:env LOVE_ANDROID_KEYSTORE_PASSWORD -keypass:env LOVE_ANDROID_KEY_PASSWORD \
            -alias love -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=CI signing fixture'
          export LOVE_ANDROID_KEYSTORE_BASE64=$(base64 -w0 "$RUNNER_TEMP/source.jks")
          GITHUB_ENV= GITHUB_OUTPUT= node scripts/android-key.mjs
          export LOVE_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/love-signing.jks"
          (cd apps/client/android && ./gradlew assembleRelease --no-daemon)
          LOVE_APK_PATH=apps/client/android/app/build/outputs/apk/release/app-release.apk \
            LOVE_APK_SIGNING_METADATA="$RUNNER_TEMP/love-signing.json" python scripts/verify-android-push.py
          # This fixture APK/key never becomes a downloadable artifact or public release.
      - name: Prepare verified Android artifact
        run: |
          mkdir -p android-artifact
          cp "${{ steps.signing.outputs.apk }}" android-artifact/love.apk
          cp "${{ steps.signing.outputs.metadata }}" android-artifact/signing.json
      - uses: actions/upload-artifact@v4
        with:
          name: love-android-apk
          path: android-artifact/
          retention-days: 30
