name: Build and publish container images
on:
  pull_request:
    paths:
      - '.github/workflows/containers.yml'
      - 'Dockerfile'
      - 'love'
      - 'scripts/setup*'
      - 'compose*.yml'
      - 'deploy/**'
  workflow_run:
    workflows: [Test and build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and build run from current main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: containers-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      image: ${{ steps.source.outputs.image }}
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - name: Select and verify source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            source_sha="$PR_SHA"
          else
            [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > jobs.json
            node --input-type=module <<'JS'
            import assert from 'node:assert/strict';
            import { readFileSync, writeFileSync } from 'node:fs';
            const run = JSON.parse(readFileSync('run.json'));
            const jobs = JSON.parse(readFileSync('jobs.json')).jobs;
            assert.equal(run.name, 'Test and build');
            assert.equal(run.conclusion, 'success');
            assert.equal(run.head_branch, 'main');
            assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
            assert.ok(['push', 'workflow_dispatch'].includes(run.event));
            for (const name of ['test', 'postgres', 'docker (Dockerfile)', 'docker (Dockerfile.cn)', 'android', 'manager', 'manager-arm'])
              assert.ok(jobs.some(job => job.name === name && job.conclusion === 'success'), `${name} must pass`);
            writeFileSync('sha.txt', run.head_sha);
          JS
            source_sha=$(cat sha.txt)
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$source_sha" != "$main_sha" ]; then
              echo 'Current main has moved; skip publishing an older run.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  build:
    needs: source
    if: needs.source.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.source.outputs.image }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read application version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build native image with layer cache
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          network: host
          allow: network.host
          load: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}-${{ env.ARCH }}
            love-image-ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=love-linux-${{ env.ARCH }}-Dockerfile
          cache-to: type=gha,scope=love-linux-${{ env.ARCH }}-Dockerfile,mode=max,ignore-error=true,timeout=2m
      - name: Test image and persisted data
        run: |
          docker run -d --name love-smoke -p 127.0.0.1:3000:3000 \
            -e MEDIA_SIGNING_SECRET=ci-image-signing-key-for-smoke-tests-only \
            -e ADMIN_USERNAME=ci_admin -e ADMIN_PASSWORD=ci-admin-password-for-smoke \
            -v love-image-data:/app/data love-image-ci
          node scripts/docker-smoke.mjs
          docker restart love-smoke
          node scripts/docker-smoke.mjs --verify-persistence
      - name: Push tested architecture to GHCR
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:sha-$SOURCE_SHA-$ARCH"
      - name: Clean test containers
        if: always()
        run: |
          docker logs love-smoke || true
          docker rm -f love-smoke || true
          docker volume rm love-image-data || true
  publish:
    needs: [source, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.source.outputs.image }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify current main and publish multi-platform manifest
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$SOURCE_SHA" = "$main_sha"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            -t "$IMAGE:sha-$SOURCE_SHA" -t "$IMAGE:main" -t "$IMAGE:latest" \
            "$IMAGE:sha-$SOURCE_SHA-amd64" "$IMAGE:sha-$SOURCE_SHA-arm64"
          mkdir -p images
          docker buildx imagetools inspect --raw "$IMAGE:sha-$SOURCE_SHA" > images/manifest.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('images/manifest.json'));
          assert.deepEqual(manifest.manifests.map(x => x.platform.os + '/' + x.platform.architecture).sort(), ['linux/amd64', 'linux/arm64']);
          writeFileSync('images/image-info.json', JSON.stringify({source: process.env.SOURCE_SHA, image: process.env.IMAGE, platforms: manifest.manifests.map(x => ({...x.platform, digest: x.digest}))}, null, 2) + '\n');
          JS
          rm images/manifest.json
