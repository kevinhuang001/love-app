name: Publish Android release
on:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and build run containing the APK
        required: true
        type: string
      tag:
        description: New version tag, for example v2.0.1
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id || '37453656707' }}
      RELEASE_TAG: ${{ inputs.tag || 'v2.0.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested source and current main
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.][A-Za-z0-9.\-]+)?$ ]]
          gh run view "$SOURCE_RUN_ID" --json conclusion,headSha,workflowName > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync('source-run.json', 'utf8'));
          const jobs = JSON.parse(readFileSync('source-jobs.json', 'utf8')).jobs;
          assert.equal(run.workflowName, 'Test and build');
          assert.equal(run.conclusion, 'success');
          assert.match(run.headSha, /^[a-f0-9]{40}$/);
          for (const name of ['test', 'docker', 'android'])
            assert.ok(jobs.some(job => job.name === name && job.conclusion === 'success'), `${name} must pass`);
          writeFileSync('source-sha.txt', run.headSha);
          JS
          source_sha=$(cat source-sha.txt)
          git merge-base --is-ancestor "$source_sha" origin/main
          git diff --exit-code "$source_sha" HEAD -- . ':(exclude).github/workflows/release.yml'
          # Never replace an existing published version.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release tag already exists; choose a new tag.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: love-android-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Prepare APK and checksum
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          apk="Love-${RELEASE_TAG}-debug.apk"
          mv release/app-debug.apk "release/$apk"
          (cd release && sha256sum "$apk" > "$apk.sha256")
          cat > release/NOTES.md <<'NOTES'
          新增中国大陆安卓厂商推送，前台隐藏管理入口。

          - 原生集成华为、荣耀、小米/Redmi、OPPO（兼容一加/realme）、vivo（兼容 iQOO）、魅族六家 SDK，通过极光的厂商通道投递，保留 FCM，国内通道优先。
          - 通知权限与设备标识用途说明；用户开启通知前不初始化国内推送，FCM 默认关闭自动注册。
          - 点击厂商通知可冷启动进入聊天；账号切换、令牌更新、关闭通知和退出登录同步设备注册。
          - 服务端分流、持久重试、已读抑制、失效令牌清理和逐设备接受状态；后台展示提供者、设备数量与失败任务。
          - 登录页与用户设置不显示管理入口。管理员自行访问 /#admin，服务端独立鉴权不变。
          - Docker 新增极光服务端环境变量，Actions 新增厂商客户端配置 Secret，完整配置与验收见 Android 文档。

          APK 来自通过 test、docker、android 三项任务的 GitHub Actions 构建；CI 检查六家 SDK 的实际 DEX、Manifest 和通知权限，附 SHA-256 文件。
          这是调试签名 APK。若与已安装版本签名不一致，需卸载旧包再安装；正式使用请固定 keystore，并配置真实签名指纹。
          客户端未注入凭据时会标记推送未配置。真实离线送达需要极光账户、各厂商凭据/审核、服务端配置与真机验证；CI 不宣称已完成厂商实际送达测试。
          已部署 v4 数据库的用户保留原数据卷即可，无需清空数据。

          安卓推送配置：https://github.com/kevinhuang001/love-app/blob/main/docs/android.md
          Docker 部署：https://github.com/kevinhuang001/love-app/blob/main/docs/deployment.md
          管理后台：https://github.com/kevinhuang001/love-app/blob/main/docs/admin.md
          NOTES
      - name: Publish release with APK assets
        run: |
          set -euo pipefail
          apk="Love-${RELEASE_TAG}-debug.apk"
          gh release create "$RELEASE_TAG" "release/$apk" "release/$apk.sha256" \
            --target "$GITHUB_SHA" --title "Love $RELEASE_TAG" --notes-file release/NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
