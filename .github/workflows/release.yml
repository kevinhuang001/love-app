name: Publish Android release
on:
  workflow_run:
    workflows: [Test and build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and build run containing the APK
        required: true
        type: string
      tag:
        description: New version tag, for example v2.2.5
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      RELEASE_TAG: ${{ inputs.tag || 'v2.2.5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify tested source and current main
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.][A-Za-z0-9.\-]+)?$ ]]
          gh run view "$SOURCE_RUN_ID" --json conclusion,headSha,workflowName > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync('source-run.json', 'utf8'));
          const jobs = JSON.parse(readFileSync('source-jobs.json', 'utf8')).jobs;
          assert.equal(run.workflowName, 'Test and build');
          assert.equal(run.conclusion, 'success');
          assert.match(run.headSha, /^[a-f0-9]{40}$/);
          for (const name of ['test', 'postgres', 'docker (Dockerfile)', 'docker (Dockerfile.cn)', 'android'])
            assert.ok(jobs.some(job => job.name === name && job.conclusion === 'success'), `${name} must pass`);
          writeFileSync('source-sha.txt', run.headSha);
          JS
          source_sha=$(cat source-sha.txt)
          git merge-base --is-ancestor "$source_sha" origin/main
          git diff --exit-code "$source_sha" HEAD -- . ':(exclude).github/workflows/release.yml'
          # Never replace an existing published version.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo 'APK version is already published; leave the existing release intact.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'This release tag already exists; choose a new tag.' >&2
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publish == 'true'
        with:
          name: love-android-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Prepare APK and checksum
        if: steps.source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          apk="Love-${RELEASE_TAG}-debug.apk"
          mv release/app-debug.apk "release/$apk"
          (cd release && sha256sum "$apk" > "$apk.sha256")
          cat > release/NOTES.md <<'NOTES'
          修复公网 HTTP 部署的页面资源加载、聊天和相册上传。

          - HTTP 不再发送 upgrade-insecure-requests、COOP、Origin-Agent-Cluster 和 HSTS，避免将普通 HTTP 端口上的资源强制改成 HTTPS。
          - HTTPS 和可信反向代理继续使用对应安全响应头；HTTP 保留 CSP、脚本限制、nosniff 等保护。
          - 聊天和相册使用 getRandomValues 生成 UUID，公网 HTTP 也能发送消息、上传图片。
          - CI 使用非 localhost HTTP 域名加载实际生产构建，验证 CSS/JS/图标、登录、实时聊天和图片预览；容器测试检查响应头。
          - 初始化支持 HTTP、Certbot 自动申请/续期、Caddy 自动 HTTPS，以及已有反向代理；无需宿主机安装 Certbot。
          - HTTPS 支持自定义公网端口（例如 8013），监听地址、访问 URL 和 HTTP 跳转保持一致；后端 HTTP 只在容器网络内开放，避免端口冲突。
          - 更新保留现有数据卷和 .env。HTTP 直连设置 LOVE_HTTPS=0、TRUST_PROXY=0；HTTPS 反向代理按部署文档配置。

          APK 来自通过 test、postgres、docker、android 的 Actions 构建，附 SHA-256；这是调试签名，更新时签名不一致需卸载旧包，正式使用请固定 keystore。
          通知以应用进程存活为前提，有常驻连接通知。请允许后台运行并将电池设为“不受限制”；系统休眠可能造成延迟，实际锁屏送达需要真机验证。
          现有 schema 4 数据卷无需清空。已有额度 0 现在禁止上传，请管理员按需要分配容量。

          Android：https://github.com/kevinhuang001/love-app/blob/main/docs/android.md
          Docker：https://github.com/kevinhuang001/love-app/blob/main/docs/deployment.md
          管理：https://github.com/kevinhuang001/love-app/blob/main/docs/admin.md
          NOTES
      - name: Publish release with APK assets
        if: steps.source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          apk="Love-${RELEASE_TAG}-debug.apk"
          gh release create "$RELEASE_TAG" "release/$apk" "release/$apk.sha256" \
            --target "$GITHUB_SHA" --title "Love $RELEASE_TAG" --notes-file release/NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
