name: Publish release
on:
  workflow_run:
    workflows: [Test and build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Test and build run containing the APK
        required: true
        type: string
      tag:
        description: New version tag, for example v2.11.0
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      RELEASE_TAG: ${{ inputs.tag || 'v2.11.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify tested source and current main
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-\.][A-Za-z0-9.\-]+)?$ ]]
          gh run view "$SOURCE_RUN_ID" --json conclusion,headSha,workflowName > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > source-jobs.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync('source-run.json', 'utf8'));
          const jobs = JSON.parse(readFileSync('source-jobs.json', 'utf8')).jobs;
          assert.equal(run.workflowName, 'Test and build');
          assert.equal(run.conclusion, 'success');
          assert.match(run.headSha, /^[a-f0-9]{40}$/);
          for (const name of ['test', 'postgres', 'docker (Dockerfile)', 'docker (Dockerfile.cn)', 'android', 'manager', 'manager-arm'])
            assert.ok(jobs.some(job => job.name === name && job.conclusion === 'success'), `${name} must pass`);
          writeFileSync('source-sha.txt', run.headSha);
          JS
          source_sha=$(cat source-sha.txt)
          git merge-base --is-ancestor "$source_sha" origin/main
          git diff --exit-code "$source_sha" HEAD -- . ':(exclude).github/workflows/release.yml'
          # Never replace an existing published version.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
              echo 'APK version is already published; leave the existing release intact.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'This release tag already exists; choose a new tag.' >&2
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publish == 'true'
        with:
          name: love-android-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.publish == 'true'
        with:
          name: love-manager
          path: release/manager
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify manager JS and tested source
        if: steps.source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          (cd release/manager && sha256sum -c SHA256SUMS)
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, statSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const m=JSON.parse(readFileSync('release/manager/manager-release.json'));
          assert.equal(m.source,readFileSync('source-sha.txt','utf8'));
          assert.equal('v'+m.version,process.env.RELEASE_TAG);
          assert.equal(m.runtime,'node24');
          assert.deepEqual(m.assets.map(x=>x.name),['love-manager.mjs']);
          for (const asset of m.assets) {
            assert.match(asset.sha256,/^[a-f0-9]{64}$/);
            assert.equal(asset.bytes,statSync('release/manager/'+asset.name).size);
            assert.equal(asset.sha256,createHash('sha256').update(readFileSync('release/manager/'+asset.name)).digest('hex'));
            assert.ok(asset.bytes < 5*1024*1024,'manager must not embed a runtime');
          }
          JS
      - name: Prepare APK and checksum
        if: steps.source.outputs.publish == 'true'
        id: apk
        run: |
          set -euo pipefail
          test -s release/love.apk
          if ! node --input-type=module -e 'import{readFileSync}from"node:fs";const s=JSON.parse(readFileSync("release/signing.json","utf8"));if(s.mode!=="release"||!/^[a-f0-9]{64}$/.test(s.certificateSha256))process.exit(1)'; then
            echo '::warning::No fixed signing key configured. CI debug APK stays in Actions; configure Android signing Secrets to publish an APK that can retain login data across updates.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          apk="Love-${RELEASE_TAG}.apk"
          mv release/love.apk "release/$apk"
          (cd release && sha256sum "$apk" > "$apk.sha256")
          cp release/signing.json "release/$apk.signing.json"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: steps.source.outputs.publish == 'true'
        run: |
          cat > release/NOTES.md <<'NOTES'
          Love 2.11.0：系统 Node.js 管理器、后台上传队列与分片续传。

          - 管理器只安装一个 JS 文件，需要系统 Node.js 24；不再内嵌 Bun/Node 或使用 XZ。
          - 相册点击上传即可离开页面，统一上传中心查看进度、历史、取消和重试。
          - 安卓原生 dataSync 前台服务持续上传，通知显示进度；本地原子日志保存任务。
          - 分片持久化、校验与断点续传；重试通过固定任务 ID 防止重复保存。
          - 媒体、相册回忆和存储容量在一个数据库事务中提交；外部 PostgreSQL 默认重试 8 次，上传重试 12 次。
          - 旧版二进制管理器请重新运行安装命令以切换到 JS；保留现有配置和数据。

          发布产物来自通过完整 CI 的提交，附 SHA-256；APK 附固定签名指纹。
          请覆盖安装以保留登录信息；既有数据卷无需清空。
          Android：https://github.com/kevinhuang001/love-app/blob/main/docs/user/android.md
          部署：https://github.com/kevinhuang001/love-app/blob/main/docs/user/install.md
          管理：https://github.com/kevinhuang001/love-app/blob/main/docs/user/admin.md
          NOTES
      - name: Publish manager and optional signed APK assets
        if: steps.source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          assets=(release/manager/love-manager.mjs release/manager/SHA256SUMS release/manager/manager-release.json)
          if [ "${{ steps.apk.outputs.publish }}" = true ]; then
            apk="Love-${RELEASE_TAG}.apk"
            assets+=("release/$apk" "release/$apk.sha256" "release/$apk.signing.json")
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" --title "Love $RELEASE_TAG" --notes-file release/NOTES.md --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
