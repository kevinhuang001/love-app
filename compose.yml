services:
  love:
    image: ${LOVE_IMAGE:-ghcr.io/kevinhuang001/love-app:latest}
    ports:
      - target: 3000
        published: '${LOVE_PORT:-3000}'
        host_ip: '${LOVE_BIND_IP:-127.0.0.1}'
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-60000}
      PG_QUERY_TIMEOUT_MS: ${PG_QUERY_TIMEOUT_MS:-120000}
      PG_RETRY_ATTEMPTS: ${PG_RETRY_ATTEMPTS:-3}
      PG_RETRY_DELAY_MS: ${PG_RETRY_DELAY_MS:-1000}
      DATABASE_PATH: /app/data/love.sqlite
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: Asia/Shanghai
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?Run ./love to configure first deployment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${LOVE_DOMAIN:-localhost},https://localhost,capacitor://localhost}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - ${LOVE_DATA_VOLUME:-love-data}:/app/data
    restart: unless-stopped
    init: true
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    depends_on:
      love:
        condition: service_healthy
    environment:
      LOVE_DOMAIN: ${LOVE_DOMAIN:-localhost}
      LOVE_TLS_PORT: ${LOVE_TLS_PORT:-443}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
  love-data:
  postgres-work:
