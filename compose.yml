services:
  love:
    image: ${LOVE_IMAGE:-love-app:local}
    build:
      context: .
      dockerfile: ${LOVE_DOCKERFILE:-Dockerfile}
    ports:
      - target: 3000
        published: '${LOVE_PORT:-3000}'
        host_ip: '${LOVE_BIND_IP:-127.0.0.1}'
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_PATH: /app/data/love.sqlite
      INITIAL_QUOTA_MIB: ${INITIAL_QUOTA_MIB:-1024}
      INITIAL_REGISTRATION: ${INITIAL_REGISTRATION:-closed}
      INITIAL_SMTP_HOST: ${INITIAL_SMTP_HOST:-}
      INITIAL_SMTP_PORT: ${INITIAL_SMTP_PORT:-587}
      INITIAL_SMTP_SECURITY: ${INITIAL_SMTP_SECURITY:-starttls}
      INITIAL_SMTP_USER: ${INITIAL_SMTP_USER:-}
      INITIAL_SMTP_PASSWORD: ${INITIAL_SMTP_PASSWORD:-}
      INITIAL_SMTP_FROM: ${INITIAL_SMTP_FROM:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: Asia/Shanghai
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?Run ./love up to configure first deployment}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${LOVE_DOMAIN:-localhost},https://localhost,capacitor://localhost}
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - love-data:/app/data
    restart: unless-stopped
    init: true
  proxy:
    image: caddy:2-alpine
    profiles: [https]
    depends_on:
      love:
        condition: service_healthy
    environment:
      LOVE_DOMAIN: ${LOVE_DOMAIN:-localhost}
      LOVE_TLS_PORT: ${LOVE_TLS_PORT:-443}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
  love-data:
